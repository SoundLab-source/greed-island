<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Greed Island: watch and bet</title>
  <meta name="description" content="An always-on stream of AI fighters. Bet free play money, buy fighters and grow them.">
  <link rel="stylesheet" href="site.css">
  <link rel="stylesheet" href="watch.css">
</head>
<body class="watch-page">
  <main class="layout">
    <!-- Who's betting on what, then recent results. -->
    <aside class="bets" aria-label="Bets">
      <div id="recap" class="recap" hidden>
        <div class="spread"><h2 id="recap-title">While you were away</h2><button id="recap-close" class="ghost small" type="button" aria-label="Close">×</button></div>
        <ul id="recap-lines"></ul>
      </div>
      <div class="bets-head">
        <h2>Bets</h2>
        <span id="bets-note" class="muted"></span>
      </div>
      <div class="split" id="bets-split" hidden>
        <div class="row"><span class="red" id="bets-red"></span><span class="blue" id="bets-blue"></span></div>
        <div class="bar"><span class="r" id="bets-bar-red"></span><span class="b" id="bets-bar-blue"></span></div>
      </div>
      <p id="bets-hidden" class="muted bets-hidden" hidden>Sides show when betting closes.</p>
      <ol id="bets-list" class="bets-list"></ol>
      <div id="feed" class="feed">
        <h2>Results</h2>
        <p class="muted" id="feed-note">Results show here as fights finish.</p>
        <ol id="feed-list"></ol>
      </div>
    </aside>

    <!-- The fight, as big as the window allows, and the bet right under it. -->
    <section class="stage">
      <div class="screen"><div class="video"><iframe id="player" title="Live fights" allow="autoplay; fullscreen" allowfullscreen></iframe></div></div>
      <div class="betbar">
        <button id="bet1" class="side red" disabled></button>
        <div class="center">
          <div class="fightline">
            <span id="fight-label">Loading…</span>
            <span id="countdown" class="countdown"></span>
          </div>
          <div id="story" class="story" aria-live="polite"></div>
          <div class="stakebox">
            <label for="stake">Stake <span id="stake-currency">Salt</span></label>
            <input id="stake" type="number" min="1" step="1" value="10" inputmode="numeric">
            <div class="chips">
              <button data-add="10">+10</button>
              <button data-add="100">+100</button>
              <button data-share="0.25">25%</button>
              <button data-share="0.5">50%</button>
              <button data-share="1">All</button>
            </div>
          </div>
          <div id="my-bet" class="my-bet"></div>
          <div id="bet-msg" class="msg" role="status"></div>
          <div class="matchup" id="matchup"></div>
        </div>
        <button id="bet2" class="side blue" disabled></button>
      </div>
    </section>

    <!-- Chat. -->
    <aside class="social" aria-label="Chat">
      <iframe id="chat" title="Chat" hidden></iframe>
      <div id="chat-off" class="chat-off"><h2>Chat</h2><p class="muted">Chat opens here once the Twitch channel is set (GI_TWITCH_CHANNEL).</p></div>
    </aside>
  </main>

  <script src="site.js"></script>
  <script src="watch.js"></script>
</body>
</html>
