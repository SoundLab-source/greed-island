<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <!--share-meta-->
  <title>Called it · Greed Island</title>
  <meta name="description" content="A right call on Greed Island: AI fighters on a live stream, and free play money to bet on them.">
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="Greed Island">
  <meta property="og:title" content="Called it on Greed Island">
  <!--/share-meta-->
  <link rel="stylesheet" href="/site.css">
  <style>
    .call { max-width: 860px; margin: 10px auto 0; }
    .call img { display: block; width: 100%; height: auto; border-radius: 12px; border: 1px solid var(--line); image-rendering: pixelated; }
    .kicker { margin: 18px 0 0; color: var(--gold); font-weight: 800; letter-spacing: 2px; text-transform: uppercase; font-size: 13px; }
    .call h1 { font-size: 34px; margin: 4px 0 6px; line-height: 1.15; }
    .call .lead { margin-bottom: 14px; }
    .won { color: var(--green); }
    .actions { margin-bottom: 10px; }
    .actions .btn, .actions .ghost { padding: 9px 18px; }
    .link-box { display: flex; gap: 8px; align-items: center; margin: 4px 0 16px; }
    .link-box input { flex: 1 1 auto; min-width: 0; color: var(--dim); font-size: 13px; }
    @media (max-width: 760px) { .call h1 { font-size: 26px; } }
  </style>
</head>
<body>
  <main class="page">
    <div class="call" id="call" hidden>
      <img id="picture" alt="">
      <p class="kicker" id="kicker">Called it</p>
      <h1 id="title"></h1>
      <p class="lead" id="line"></p>
      <div class="row actions">
        <button class="btn" id="share-btn" type="button">Share</button>
        <button class="ghost" id="copy-btn" type="button">Copy link</button>
        <a class="ghost" href="/">Watch and bet</a>
      </div>
      <div class="link-box"><input id="link" readonly aria-label="Link to this call"></div>
      <p class="msg" id="msg" role="status"></p>
    </div>
    <div class="panel" id="missing" hidden><p class="empty">There's no such call. <a href="/">Watch the stream</a>.</p></div>
  </main>
  <script src="/site.js"></script>
  <script src="/call.js"></script>
</body>
</html>
