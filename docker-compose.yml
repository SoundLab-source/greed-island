# Local Postgres for development and tests. Credentials are local-only defaults.
services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: greed
      POSTGRES_PASSWORD: greed
      POSTGRES_DB: greed_island
    ports:
      - "54329:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./docker/initdb:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U greed -d greed_island"]
      interval: 2s
      timeout: 3s
      retries: 30

volumes:
  pgdata:
