# Local Postgres for development, tests and the stream machine. Credentials are local-only
# defaults, so the port is only open to this machine (127.0.0.1), never the network.
services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: greed
      POSTGRES_PASSWORD: greed
      POSTGRES_DB: greed_island
    ports:
      - "127.0.0.1:54329:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./docker/initdb:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U greed -d greed_island"]
      interval: 2s
      timeout: 3s
      retries: 30

volumes:
  pgdata:
